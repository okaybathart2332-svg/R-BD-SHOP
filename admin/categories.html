<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ক্যাটাগরি | R BD SHOP Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../frontend/assets/favicon.ico" type="image/x-icon" />
  <script>(function(){try{var s=localStorage.getItem('rbd-theme');if(s==='dark')document.documentElement.setAttribute('data-theme','dark');else if(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="css/admin-variables.css" />
  <link rel="stylesheet" href="css/admin-base.css" />
  <link rel="stylesheet" href="css/admin-layout.css" />
  <link rel="stylesheet" href="css/admin-components.css" />
  <link rel="stylesheet" href="css/admin-responsive.css" />
</head>
<body>

  <div id="admin-page-loader"><div class="admin-loader-content"><span class="admin-loader-logo">R BD SHOP</span><div class="a-spinner a-spinner--lg"></div></div></div>

  <div class="admin-wrapper">
    <div id="sidebar-root"></div>
    <main class="admin-main">
      <div id="header-root"></div>
      <div class="admin-content">

        <div class="admin-page-header">
          <div class="admin-page-header__left">
            <h2 class="admin-page-header__title">ক্যাটাগরি ম্যানেজমেন্ট</h2>
            <p class="admin-page-header__desc">ক্যাটাগরি যোগ, এডিট, ও মুছে ফেলুন</p>
          </div>
          <div class="admin-page-header__actions">
            <button class="a-btn a-btn--primary" id="btn-add-category">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              নতুন ক্যাটাগরি
            </button>
          </div>
        </div>

        <!-- Categories Table -->
        <div class="a-card">
          <div class="data-table-wrapper">
            <table class="data-table">
              <thead>
                <tr>
                  <th>ক্যাটাগরি নাম</th>
                  <th>স্লাগ</th>
                  <th>পণ্য সংখ্যা</th>
                  <th>স্ট্যাটাস</th>
                  <th>তারিখ</th>
                  <th style="text-align:right">অ্যাকশন</th>
                </tr>
              </thead>
              <tbody id="categories-tbody"></tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal Root -->
  <div id="modal-root"></div>
  <div id="admin-toast-container"></div>
  <script type="module" src="js/categories.js"></script>
</body>
                </html>
