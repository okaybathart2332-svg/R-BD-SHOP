<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>রিভিউ | R BD SHOP Admin</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../frontend/assets/favicon.ico" type="image/x-icon" />
  <script>(function(){try{var s=localStorage.getItem('rbd-theme');if(s==='dark')document.documentElement.setAttribute('data-theme','dark');else if(!s&&window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="css/admin-variables.css" />
  <link rel="stylesheet" href="css/admin-base.css" />
  <link rel="stylesheet" href="css/admin-layout.css" />
  <link rel="stylesheet" href="css/admin-components.css" />
  <link rel="stylesheet" href="css/admin-responsive.css" />
</head>
<body>
  <div id="admin-page-loader"><div class="admin-loader-content"><span class="admin-loader-logo">R BD SHOP</span><div class="a-spinner a-spinner--lg"></div></div></div>
  <div class="admin-wrapper">
    <div id="sidebar-root"></div>
    <main class="admin-main">
      <div id="header-root"></div>
      <div class="admin-content">
        <div class="admin-page-header">
          <div class="admin-page-header__left">
            <h2 class="admin-page-header__title">রিভিউ মডারেশন</h2>
            <p class="admin-page-header__desc">গ্রাহকদের রিভিউ অনুমোদন বা প্রত্যাখ্যান করুন</p>
          </div>
        </div>

        <!-- Filter tabs -->
        <div class="admin-tabs" id="review-tabs" style="margin-bottom:var(--a-space-5)">
          <button class="admin-tab active" data-filter="all">সব</button>
          <button class="admin-tab" data-filter="pending">পেন্ডিং</button>
          <button class="admin-tab" data-filter="approved">অনুমোদিত</button>
          <button class="admin-tab" data-filter="rejected">প্রত্যাখ্যাত</button>
        </div>

        <!-- Reviews Grid -->
        <div id="reviews-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--a-space-4)">
          <div class="a-flex-center" style="grid-column:1/-1;padding:var(--a-space-10)"><div class="a-spinner a-spinner--lg"></div></div>
        </div>
      </div>
    </main>
  </div>
  <div id="admin-toast-container"></div>
  <script type="module" src="js/reviews.js"></script>
</body>
  </html>
